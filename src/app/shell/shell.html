<header class="site-header">
  <a routerLink="/" class="brand">
    <img src="logo.jpg" alt="" />
    Captnblacky gegen Chat
  </a>
  <nav>
    @if (auth.isLoggedIn()) {
      <a routerLink="/meine-bewerbungen">Meine Bewerbungen</a>
      <a routerLink="/bingo">Bingo</a>
      @if (auth.currentProfile()?.is_admin) {
        <a routerLink="/admin">Admin</a>
      }
      <span class="user">{{ auth.currentProfile()?.display_name }}</span>
      <button type="button" (click)="logout()">Logout</button>
    } @else {
      <button type="button" (click)="login()">Login mit Twitch</button>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <a href="https://twitch.tv/captnblacky" target="_blank" rel="noopener">twitch.tv/captnblacky</a>
</footer>

<span class="version-badge">v{{ version }}</span>

<app-confirm-dialog />
