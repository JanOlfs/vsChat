@for (team of teams(); track team.teamId) {
  <div class="riot-team" [class.riot-team-red]="team.teamId === 200">
    @if (team.win !== undefined) {
      <span class="riot-team-result" [class.riot-team-won]="team.win">{{
        team.win ? 'Sieg' : 'Niederlage'
      }}</span>
    }
    @for (p of team.players; track p.puuid + p.riot_id) {
      <button
        type="button"
        class="riot-player"
        [class.riot-player-known]="p.profile_id"
        [class.riot-player-me]="p.profile_id && p.profile_id === me()"
        [class.riot-player-votable]="isVotable(p)"
        [class.riot-player-selected]="p.profile_id && p.profile_id === selected()"
        [disabled]="!isVotable(p)"
        [title]="isVotable(p) ? 'Für ' + gameName(p.riot_id) + ' stimmen' : p.champion_name"
        (click)="pick.emit(p.profile_id!)"
      >
        @if (p.champion_image) {
          <img [src]="p.champion_image" [alt]="p.champion_name" />
        } @else {
          <span class="riot-player-placeholder">{{ p.champion_name }}</span>
        }
        <span class="riot-player-name">
          {{ gameName(p.riot_id) }}
          @if (p.twitch_name) {
            <span class="riot-player-twitch">({{ p.twitch_name }})</span>
          }
        </span>
        @if (p.kills !== undefined) {
          <span class="riot-player-kda">{{ p.kills }} / {{ p.deaths }} / {{ p.assists }}</span>
        }
      </button>
    }
  </div>
}
