<header class="site-header">
  <a routerLink="/" class="brand">
    <img src="logo.jpg" alt="" />
    Captnblacky
  </a>
  <nav>
    <a routerLink="/vs-chat" routerLinkActive="active">vs Chat</a>
    @if (auth.isLoggedIn()) {
      <a routerLink="/bingo" routerLinkActive="active">Bingo</a>
      <a routerLink="/imposter" routerLinkActive="active">Imposter</a>
      @if (auth.currentProfile()?.is_admin) {
        <a routerLink="/admin" routerLinkActive="active">Admin</a>
      }
      <a routerLink="/profil" routerLinkActive="active" class="user">{{ auth.currentProfile()?.display_name }}</a>
      <button type="button" (click)="logout()">Logout</button>
    } @else {
      <button type="button" (click)="login()">Login mit Twitch</button>
    }
  </nav>
</header>

<main>
  <router-outlet />
</main>

<footer class="site-footer">
  <a href="https://twitch.tv/captnblacky" target="_blank" rel="noopener">twitch.tv/captnblacky</a>
</footer>

<span class="version-badge">v{{ version }}</span>

<app-confirm-dialog />
